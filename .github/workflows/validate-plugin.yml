name: Validate plugin
on:
  pull_request:
    paths: ['plugins/**', '.agents/**', 'agents/**', 'schemas/**', 'config/**', '.github/workflows/validate-plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/AgentTool.Tests/AgentTool.Tests.csproj --filter FullyQualifiedName~MetadataTests
      - run: dotnet tools/AgentTool.cs validate
